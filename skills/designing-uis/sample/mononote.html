<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mononote</title>

<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat-nova.cdn.min.css" />

<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    margin: 0;
    font-family: "Geist", system-ui, sans-serif;
    font-size: 15px;
    background: var(--background);
    color: var(--foreground);
  }

  [hidden] { display: none !important; }

  .sheet {
    display: flex;
    flex-direction: column;
    flex: 1;
    width: 100%;
    max-width: 40rem;
    margin: 0 auto;
    padding: 3rem 1.5rem 1.25rem;
  }

  #note {
    flex: 1;
    width: 100%;
    min-height: 20rem;
    border: 0;
    padding: 0;
    resize: none;
    background: transparent;
    color: inherit;
    font: inherit;
    line-height: 1.7;
  }

  #note:focus { outline: none; }
  #note::placeholder { color: color-mix(in oklab, var(--muted-foreground) 70%, transparent); }

  .footer {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding-top: 1.25rem;
  }

  .status {
    flex: 1;
    min-width: 0;
    font-size: 12.5px;
    color: var(--muted-foreground);
  }

  .status.alert { color: var(--destructive); }

  .status button {
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }

  .mic {
    display: grid;
    place-items: center;
    width: 2.5rem;
    height: 2.5rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--background);
    color: var(--foreground);
    cursor: pointer;
  }

  .mic svg { width: 17px; height: 17px; }
  .mic[data-recording="true"] { background: var(--foreground); color: var(--background); border-color: var(--foreground); }
  .mic:disabled { opacity: 0.4; cursor: default; }

  .elapsed {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    color: var(--foreground);
  }

  .pulse {
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: var(--destructive);
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse { 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

  .gate {
    display: grid;
    place-items: center;
    flex: 1;
    padding: 1.5rem;
  }

  .gate .card { width: 100%; max-width: 21rem; }
  .gate .field { display: flex; flex-direction: column; gap: 0.375rem; margin-bottom: 0.75rem; }
  .gate label { font-size: 13px; font-weight: 500; }
  .gate .btn { width: 100%; }
  .gate .aside { margin-top: 0.75rem; font-size: 12.5px; color: var(--muted-foreground); text-align: center; }

  code {
    padding: 0.0625rem 0.25rem;
    border-radius: 4px;
    background: var(--muted);
    font-size: 0.9em;
  }
</style>
</head>

<body>
  <section class="gate" id="gate" hidden>
    <div class="card">
      <header>
        <h3 id="gate-title"></h3>
        <p id="gate-body"></p>
      </header>
      <section id="gate-form">
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" autocomplete="email" />
        </div>
        <button class="btn" id="continue">Continue</button>
        <p class="aside">New here? Signing in creates your account.</p>
      </section>
    </div>
  </section>

  <main class="sheet" id="sheet" hidden>
    <textarea id="note" placeholder="Start writing." spellcheck="false"></textarea>

    <div class="footer">
      <p class="status" id="status"></p>
      <div class="elapsed" id="elapsed" hidden><span class="pulse"></span><span id="clock">0:00</span></div>
      <button class="mic" id="mic" title="Record a voice note"></button>
    </div>
  </main>

<script>
  const ACCOUNT = "ada@mononote.app";

  const MIC_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>`;
  const STOP_ICON = `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>`;

  const OPENING_NOTE = `Ship the recorder before the sync indicator. The recorder is the reason someone opens this on a walk; sync is the reason they trust it later.

Cleanup should return one paragraph, not bullets. Bullets are a formatting decision and this note has no formatting.`;

  const CLEANED_DICTATION = `Check whether the stop button needs a confirmation on mobile. A mis-tap during a long recording loses the whole take, and there is no draft to fall back on.`;

  const gate = document.getElementById("gate");
  const gateTitle = document.getElementById("gate-title");
  const gateBody = document.getElementById("gate-body");
  const gateForm = document.getElementById("gate-form");
  const sheet = document.getElementById("sheet");
  const note = document.getElementById("note");
  const status = document.getElementById("status");
  const elapsed = document.getElementById("elapsed");
  const clock = document.getElementById("clock");
  const mic = document.getElementById("mic");

  const STATES = {
    "sign-in": {
      gate: { title: "Sign in to sync", body: `Your notes stay on this device until you sign in.`, form: true }
    },
    "setup-missing": {
      gate: { title: "Sync is not configured", body: "Set CONVEX_DEPLOY_KEY in your environment, then reload. Writing still works without it." }
    },
    editor: {
      status: "Saved locally · Synced"
    },
    syncing: {
      status: "Saving…"
    },
    offline: {
      status: "Offline · Keep writing, this syncs when you reconnect"
    },
    "sync-error": {
      status: "Could not sync · <button id='retry'>Try again</button>", alert: true
    },
    recording: {
      status: "Recording · Stop when you're done", recording: true
    },
    cleanup: {
      status: "Cleaning up the transcript…", busy: true
    },
    "mic-denied": {
      status: "Microphone blocked · Allow access in your browser settings to record", alert: true, muted: true
    }
  };

  const stateName = () => (location.hash.slice(1) in STATES ? location.hash.slice(1) : "editor");

  let timer = null;
  let seconds = 0;

  const go = (name) => {
    if (stateName() === name) render();
    else location.hash = name;
  };

  const startClock = () => {
    seconds = 0;
    clock.textContent = "0:00";
    timer = setInterval(() => {
      seconds += 1;
      clock.textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
    }, 1000);
  };

  const stopClock = () => {
    clearInterval(timer);
    timer = null;
  };

  const finishCleanup = () => {
    note.value = `${note.value.trimEnd()}\n\n${CLEANED_DICTATION}`;
    go("editor");
  };

  const render = () => {
    const name = stateName();
    const state = STATES[name];

    gate.hidden = !state.gate;
    sheet.hidden = Boolean(state.gate);

    if (state.gate) {
      gateTitle.textContent = state.gate.title;
      gateBody.textContent = state.gate.body;
      gateForm.hidden = !state.gate.form;
      stopClock();
      return;
    }

    status.innerHTML = state.status;
    status.classList.toggle("alert", Boolean(state.alert));
    elapsed.hidden = !state.recording;
    mic.disabled = Boolean(state.busy || state.muted);
    mic.dataset.recording = String(Boolean(state.recording));
    mic.innerHTML = state.recording ? STOP_ICON : MIC_ICON;

    document.getElementById("retry")?.addEventListener("click", () => {
      go("syncing");
      setTimeout(() => go("editor"), 900);
    });

    if (state.recording) startClock();
    else stopClock();

    if (!state.busy) note.focus({ preventScroll: true });
  };

  mic.addEventListener("click", () => {
    if (stateName() === "recording") {
      go("cleanup");
      setTimeout(finishCleanup, 1800);
    } else {
      go("recording");
    }
  });

  note.addEventListener("input", () => {
    if (["editor", "syncing"].includes(stateName())) {
      go("syncing");
      clearTimeout(note.dataset.timer);
      note.dataset.timer = setTimeout(() => go("editor"), 800);
    }
  });

  document.getElementById("continue").addEventListener("click", () => go("editor"));

  addEventListener("message", ({ data }) => {
    if (data?.type === "theme") document.documentElement.classList.toggle("dark", data.dark);
  });

  addEventListener("hashchange", render);

  note.value = OPENING_NOTE;
  document.getElementById("email").value = ACCOUNT;
  render();
</script>
</body>
</html>
